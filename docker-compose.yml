services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      # Demos de IA en vivo (QAP-18). El compose SOLO entrega a `app` las variables que lista: sin estas líneas el .env
      # no llega a la aplicación. Vacías = valor por defecto; sin AI_PROVIDER el modo en vivo queda APAGADO.
      # La clave (AI_API_KEY) solo vive en el .env del servidor.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_RATE_LIMIT_PER_VISITOR: ${AI_RATE_LIMIT_PER_VISITOR:-}
      AI_RATE_WINDOW_SECONDS: ${AI_RATE_WINDOW_SECONDS:-}
      AI_DAILY_CAP: ${AI_DAILY_CAP:-}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-}
      # Límite de intentos fallidos del login (QAP-20).
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - app

  # Renueva certificados automáticamente cada 12h (Certbot solo renueva
  # los que ya están a menos de 30 días de vencer, así que el "renew" de
  # más no hace nada mientras no haga falta). No emite el primer
  # certificado solo — eso se hace una vez a mano con
  # "docker compose run --rm certbot certonly ...".
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  certbot_conf:
  certbot_webroot:
