{% extends "base.html" %}
{% block content %}
<section class="admin-form">
  <h1>{{ "Editar proyecto" if editing else "Nuevo proyecto" }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Título<input type="text" name="title" value="{{ values.get('title', '') }}" required></label>
    <label>Descripción<textarea name="description" rows="4" required>{{ values.get('description', '') }}</textarea></label>
    <label>Tech stack (separado por comas)<input type="text" name="tech_stack" value="{{ values.get('tech_stack', '') }}" required></label>
    <label>URL del repo<input type="url" name="repo_url" value="{{ values.get('repo_url', '') }}"></label>
    <label>Semana del plan<input type="number" name="week" min="1" value="{{ values.get('week', '') }}"></label>
    <button type="submit">Guardar</button>
  </form>
</section>
{% endblock %}
