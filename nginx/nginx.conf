# 127.0.0.11 es el DNS interno de Docker dentro de la red del compose.
# Con proxy_pass a una URL literal (http://app:8000), Nginx resuelve el
# hostname UNA SOLA VEZ al arrancar y cachea esa IP para siempre — si el
# contenedor "app" se recrea (nueva IP interna) sin que nginx se reinicie
# también, queda apuntando a una IP muerta y todo responde 502. Usar una
# variable en proxy_pass fuerza a Nginx a resolver "app" de nuevo en cada
# request (respetando el TTL de "valid"), así sigue al contenedor aunque
# cambie de IP sin necesidad de reiniciar nginx en cada deploy.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name andresqe.duckdns.org;

    # No anunciar la versión de Nginx en la cabecera Server ni en las páginas de error.
    server_tokens off;

    # Certbot (modo webroot) escribe acá el archivo que Let's Encrypt pide
    # verificar por HTTP para confirmar que controlamos el dominio. Tiene
    # que quedar servible en texto plano incluso después de activar HTTPS
    # (las renovaciones futuras vuelven a pasar por acá).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás por 80 redirige a HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name andresqe.duckdns.org;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/andresqe.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andresqe.duckdns.org/privkey.pem;

    # Cabeceras de seguridad (QAP-21, H7). `always` las añade también a las respuestas de error (404, 502...).
    # IMPORTANTE: Nginx NO hereda los add_header de este bloque a un `location` que defina los suyos: si algún día
    # se añade un add_header dentro de un location, hay que repetir aquí todas estas.
    #
    # HSTS: obliga al navegador a usar HTTPS durante 180 días. Es deliberadamente SIN includeSubDomains y SIN
    # preload: no se puede deshacer rápido (el navegador lo recuerda), y el dominio es un subdominio de duckdns.org
    # que no controlo por completo. Si el certificado dejara de renovarse, el sitio quedaría inaccesible hasta que
    # se arregle, en vez de mostrar un aviso que el visitante pudiera saltarse.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content-Security-Policy en modo SOLO INFORME: el navegador anota las violaciones en la consola pero NO bloquea
    # nada. Una CSP estricta puede romper el sitio sin que se note, y aquí no hay un entorno de pruebas. Lista
    # exactamente lo que las plantillas usan hoy (hay una prueba que lo vigila: test_security_config.py):
    #   estilos: propios + Google Fonts (CSS)      fuentes: fonts.gstatic.com
    #   scripts: solo propios (el script en línea se movió a static/site.js)    imágenes: propias
    # Para PASAR A ENFORZAR: revisar la consola del navegador en /, /en/, /demos, /experiencia, el caso de estudio y
    # /admin/login (sin violaciones), y cambiar el nombre de la cabecera a `Content-Security-Policy`.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        set $upstream_app app:8000;
        proxy_pass http://$upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
